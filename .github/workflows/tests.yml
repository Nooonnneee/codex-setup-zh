name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Syntax check
        run: |
          node --check scripts/patch-codex-zh-cn.mjs
          node --check scripts/localization-runtime.mjs
          node --check scripts/localization-patches.mjs
          node --check scripts/install-codex.mjs
          node --check runtime/main.cjs
          node --check runtime/preload-localization.cjs

      - name: PowerShell / batch entrypoints parse
        shell: pwsh
        run: |
          $files = @(
            "scripts/install_windows.ps1",
            "scripts/package-release.ps1",
            "scripts/prepare-portable-node.ps1",
            "scripts/uninstall-codex-store.ps1",
            "launchers/launch-codex-zh-cn.ps1"
          )
          foreach ($f in $files) {
            $errors = $null
            [void][System.Management.Automation.PSParser]::Tokenize(
              (Get-Content -LiteralPath $f -Raw), [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "$f 解析失败: $($errors[0].Message)"
            }
            Write-Host "ok: $f"
          }
