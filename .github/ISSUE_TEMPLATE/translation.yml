name: 翻译遗漏 / 未汉化文案
description: 某个菜单、按钮或提示还是英文
title: "[i18n] "
labels: translation
body:
  - type: markdown
    attributes:
      value: |
        汉化词条都在 `resources/*.json`：
        - `native-menu-zh-CN.json`：原生菜单
        - `menu-hardcoded-zh-CN.json`：主进程硬编码文案
        - `bundled-plugins-zh-CN.json`：内置插件名称与描述
        - `update-prompt-zh-CN.json`：更新提示

        如果漏掉的是**动态渲染的页面**（React 渲染的正文区域），通常需要在
        `runtime/preload-localization.cjs` 里补规则，而不只是加词条。
  - type: input
    id: where
    attributes:
      label: 出现在哪个位置
      placeholder: 例如：设置 → 通用 → 语言 下拉框
    validations:
      required: true
  - type: input
    id: english
    attributes:
      label: 当前显示的英文原文
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: 建议的中文译法
  - type: input
    id: codex-version
    attributes:
      label: Codex 版本
      placeholder: 帮助 → 关于
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 直接把图片拖进来
